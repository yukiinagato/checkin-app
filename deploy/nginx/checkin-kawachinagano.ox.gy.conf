server {
  listen 80;
  listen [::]:80;
  server_name checkin-kawachinagano.ox.gy;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name checkin-kawachinagano.ox.gy;

  # 来源：manual
  ssl_certificate     /etc/ssl/certs/ox.gy.crt.pem;
  ssl_certificate_key /etc/ssl/certs/ox.gy.key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 12m;
  # 護照 OCR 是 CPU 密集的同步推理，需大於後端的 OCR_REQUEST_TIMEOUT_MS。
  proxy_read_timeout 200s;
  proxy_send_timeout 200s;

  # 方案 A：后端在 NODE_ENV=production 下托管 client/dist 并对非 /api 路径回退到 index.html
  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
